name: CI — lint and secrets

# Scope (4.1.2 lot 0): GitHub CI runs ruff correctness lint and a scan for *verified* secrets only (an empty
# result does not prove that no secret exists). Release qualification runs locally,
# per retained platform cell (gates P1–P9), and its proof is the P9 manifest attached to each GitHub Release.
# GitHub-hosted x86_64 runners are not a retained cell; per-cell CI jobs are planned for 4.1.3.
# Tools and actions are pinned to the versions used by the last successful lint and secrets-scan jobs
# (run 45457000824, 2026-11-24; the other jobs of that run failed and are not carried over).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff==0.17.6
      # Full production/test correctness gate, including bench adapters. Formatting
      # debt in research notebooks is intentionally outside the shipping gate.
      - run: ruff check tests v4/src v4/tests v4/bench scripts --select E9,F --output-format=github
      - run: ruff check tests scripts --output-format=github

  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@2921dcc5628ef65c592f8a9e73bbcded9c1fa815 # main as of 2026-11-24
        with:
          extra_args: --only-verified
