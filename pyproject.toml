[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-os-ai"
version = "4.0.6"
description = "Local project memory shared by MCP clients, with dated decisions and work state"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL-3.0"]
requires-python = ">=3.11"
authors = [
    {name = "Kocupyr Romain", email = "romainsantoli@gmail.com"},
]
keywords = ["mcp", "memory", "local-first", "semantic-search", "vscode", "copilot", "claude", "codex", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Exact numerical/encoder pins reproduce the locally qualified macOS profile.
# Transitive numeric/tokenizer packages are direct constraints, not new features.
dependencies = [
    "mcp>=1.26.0",
    "pydantic>=2.0",
    "torch==2.10.0",
    "sentence-transformers==5.2.3",
    "transformers==5.2.0",
    "numpy==2.4.2",
    "faiss-cpu==1.13.2",
    "huggingface-hub==1.5.0",
    "tokenizers==0.22.2",
    "safetensors==0.7.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
]

# Source/Issues remain the historical public repository while GitHub is frozen.
# Documentation points to the existing public package description; replace with
# the versioned documentation site only after its publication is authorized.
[project.urls]
Homepage = "https://pypi.org/project/memory-os-ai/"
Documentation = "https://pypi.org/project/memory-os-ai/#description"
Source = "https://github.com/romainsantoli-web/Memory-os-ai"
Issues = "https://github.com/romainsantoli-web/Memory-os-ai/issues"

[project.optional-dependencies]
documents = ["pymupdf>=1.24"]
legacy-v3 = [
    "pymupdf>=1.24", "pytesseract>=0.3", "python-pptx>=1.0",
    "python-docx>=1.1", "Pillow>=10.0", "requests>=2.32",
]
brief = ["tiktoken==0.12.0"]
ops = [
    "cryptography>=42",
]
audio = [
    "memory-os-ai[legacy-v3]",
    "openai-whisper>=20231117",
    "torch>=2.4",
    "torchaudio>=2.4",
]
gpu = [
    "faiss-gpu>=1.7",
    "torch>=2.4",
]
doc-legacy = [
    "memory-os-ai[legacy-v3]",
    "textract>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "build>=1.2",
    "twine>=6.0",
]
cloud-gdrive = [
    "memory-os-ai[legacy-v3]",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
cloud-dropbox = [
    "memory-os-ai[legacy-v3]",
    "dropbox>=12.0",
]
cloud-s3 = [
    "memory-os-ai[legacy-v3]",
    "boto3>=1.34",
]
cloud-azure = [
    "memory-os-ai[legacy-v3]",
    "azure-storage-blob>=12.19",
]
cloud-box = [
    "memory-os-ai[legacy-v3]",
    "boxsdk>=3.9",
]
cloud-b2 = [
    "memory-os-ai[legacy-v3]",
    "b2sdk>=2.1",
]
cloud-all = [
    "memory-os-ai[cloud-gdrive,cloud-dropbox,cloud-s3,cloud-azure,cloud-box,cloud-b2]",
]

[project.scripts]
memory-os-ai = "memory_os_v4.server:run"
memory-os-v4 = "memory_os_v4.server:run"
memory-os-ai-v3 = "memory_os_ai.legacy_cli:main"
memory-os-relay = "memory_os_v4.ops.relay:main"
memory-os-admin = "memory_os_v4.ops.cli:main"

[tool.setuptools.packages.find]
where = ["src", "v4/src"]
include = ["memory_os_ai*", "memory_os_v4*"]

[tool.setuptools.package-data]
memory_os_v4 = ["resources/*.json"]

[tool.setuptools.data-files]
"share/doc/memory-os-ai" = ["AGENTS.md", "CLAUDE.md", "CHANGELOG.md", "docs/CLIENTS.md", "docs/releases/v4.0.1.md", "docs/releases/v4.0.2.md", "docs/releases/v4.0.3.md", "docs/releases/v4.0.4.md", "docs/releases/v4.0.5.md", "docs/releases/v4.0.6.md"]
"share/doc/memory-os-ai/v4" = ["v4/docs/*.md"]
"share/doc/memory-os-ai/v4/contracts" = ["v4/docs/contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "v4/src", "v4"]
markers = ["slow: loads a real sentence-transformers model"]
asyncio_mode = "auto"
filterwarnings = [
    # faiss-cpu SWIG bindings emit harmless DeprecationWarnings
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/memory_os_ai"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # line-too-long — handled by formatter not linter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # imports after setup are common in tests
