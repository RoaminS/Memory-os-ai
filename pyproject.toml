[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-os-ai"
version = "4.0.7"
description = "Local project memory shared by MCP clients, with dated decisions and work state"
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE.GPL-3.0"]
requires-python = ">=3.11"
authors = [
    {name = "Kocupyr Romain", email = "romainsantoli@gmail.com"},
]
keywords = ["mcp", "memory", "local-first", "semantic-search", "vscode", "copilot", "claude", "codex", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Exact active core closure from qualified macOS arm64 CPython 3.11 METADATA.
# Transitive pins deliberately fail resolution rather than drift into MCP 2.x.
dependencies = [
    "annotated-doc==0.0.4",
    "annotated-types==0.7.0",
    "anyio==4.12.1",
    "attrs==25.4.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "click==8.3.1",
    "cryptography==46.0.5",
    "faiss-cpu==1.13.2",
    "filelock==3.25.0",
    "fsspec==2026.2.0",
    "h11==0.16.0",
    "hf-xet==1.3.2",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "huggingface-hub==1.5.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "joblib==1.5.3",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mcp==1.26.0",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.4.2",
    "packaging==26.3",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.13.1",
    "pygments==2.19.2",
    "pyjwt==2.11.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.22",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "regex==2026.2.28",
    "rich==14.3.3",
    "rpds-py==0.30.0",
    "safetensors==0.7.0",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "sentence-transformers==5.2.3",
    "shellingham==1.5.4",
    "sse-starlette==3.3.2",
    "starlette==0.52.1",
    "sympy==1.14.0",
    "threadpoolctl==3.6.0",
    "tokenizers==0.22.2",
    "torch==2.10.0",
    "tqdm==4.67.3",
    "transformers==5.2.0",
    "typer==0.24.1",
    "typer-slim==0.24.0",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.41.0",
]

# Source/Issues remain the historical public repository while GitHub is frozen.
# Documentation points to the existing public package description; replace with
# the versioned documentation site only after its publication is authorized.
[project.urls]
Homepage = "https://pypi.org/project/memory-os-ai/"
Documentation = "https://pypi.org/project/memory-os-ai/#description"
Source = "https://github.com/romainsantoli-web/Memory-os-ai"
Issues = "https://github.com/romainsantoli-web/Memory-os-ai/issues"

[project.optional-dependencies]
documents = ["pymupdf>=1.24"]
legacy-v3 = [
    "pymupdf>=1.24", "pytesseract>=0.3", "python-pptx>=1.0",
    "python-docx>=1.1", "Pillow>=10.0", "requests>=2.32",
]
brief = ["charset-normalizer==3.4.4", "requests==2.32.5", "tiktoken==0.12.0", "urllib3==2.6.3"]
ops = [
    "cryptography==46.0.5",
]
audio = [
    "memory-os-ai[legacy-v3]",
    "openai-whisper>=20231117",
    "torch>=2.4",
    "torchaudio>=2.4",
]
gpu = [
    "faiss-gpu>=1.7",
    "torch>=2.4",
]
doc-legacy = [
    "memory-os-ai[legacy-v3]",
    "textract>=1.6",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
    "build>=1.2",
    "twine>=6.0",
]
cloud-gdrive = [
    "memory-os-ai[legacy-v3]",
    "google-api-python-client>=2.100",
    "google-auth>=2.23",
    "google-auth-oauthlib>=1.1",
]
cloud-dropbox = [
    "memory-os-ai[legacy-v3]",
    "dropbox>=12.0",
]
cloud-s3 = [
    "memory-os-ai[legacy-v3]",
    "boto3>=1.34",
]
cloud-azure = [
    "memory-os-ai[legacy-v3]",
    "azure-storage-blob>=12.19",
]
cloud-box = [
    "memory-os-ai[legacy-v3]",
    "boxsdk>=3.9",
]
cloud-b2 = [
    "memory-os-ai[legacy-v3]",
    "b2sdk>=2.1",
]
cloud-all = [
    "memory-os-ai[cloud-gdrive,cloud-dropbox,cloud-s3,cloud-azure,cloud-box,cloud-b2]",
]

[project.scripts]
memory-os-ai = "memory_os_v4.server:run"
memory-os-v4 = "memory_os_v4.server:run"
memory-os-ai-v3 = "memory_os_ai.legacy_cli:main"
memory-os-relay = "memory_os_v4.ops.relay:main"
memory-os-admin = "memory_os_v4.ops.cli:main"

[tool.setuptools.packages.find]
where = ["src", "v4/src"]
include = ["memory_os_ai*", "memory_os_v4*"]

[tool.setuptools.package-data]
memory_os_v4 = ["resources/*.json", "resources/*.txt"]

[tool.setuptools.data-files]
"share/doc/memory-os-ai" = ["AGENTS.md", "CLAUDE.md", "CHANGELOG.md", "docs/CLIENTS.md", "docs/releases/v4.0.1.md", "docs/releases/v4.0.2.md", "docs/releases/v4.0.3.md", "docs/releases/v4.0.4.md", "docs/releases/v4.0.5.md", "docs/releases/v4.0.6.md", "docs/releases/v4.0.6.dev0.md", "docs/releases/v4.0.7.md", "docs/releases/v4.0.7rc1.md"]
"share/doc/memory-os-ai/v4" = ["v4/docs/*.md"]
"share/doc/memory-os-ai/v4/contracts" = ["v4/docs/contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "v4/src", "v4"]
markers = ["slow: loads a real sentence-transformers model"]
asyncio_mode = "auto"
filterwarnings = [
    # faiss-cpu SWIG bindings emit harmless DeprecationWarnings
    "ignore:builtin type Swig:DeprecationWarning",
    "ignore:builtin type swigvarlink:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/memory_os_ai"]
branch = true

[tool.coverage.report]
fail_under = 80

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]  # line-too-long — handled by formatter not linter

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]  # imports after setup are common in tests
